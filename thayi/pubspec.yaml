name: setu_thayi
description: "Setu Thayi - the mother-facing app of Setu, a maternal health platform for rural Karnataka."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  flutter_riverpod: ^2.6.1
  google_fonts: ^6.2.1
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.3
  speech_to_text: ^7.0.0
  permission_handler: ^12.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/google_fonts/
